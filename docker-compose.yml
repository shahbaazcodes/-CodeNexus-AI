
services:
  mcp-server:
    build: .
    command: uvicorn mcp_server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env

  web-server:
    build: .
    command: uvicorn web_server:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      - mcp-server